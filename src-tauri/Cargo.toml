[package]
name = "task-timer"
version = "1.3.0"
description = "Task list with deadlines and countdown timers"
authors = ["Kyle Tam"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
tauri-winrt-notification = "0.7"

# Make the .exe as small as possible.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
