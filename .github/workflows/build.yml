# Builds the Windows app (Task-Timer.exe) on GitHub's own Windows computer
# every time changes are pushed. The finished .exe appears on the
# repository's "Releases" page, labelled with its version (e.g. "Task Timer 1.2.0").
# To release a new version, change the version number in all four places:
# package.json, src/version.js, src-tauri/tauri.conf.json and src-tauri/Cargo.toml
# (npm test checks that they match).
name: Build Windows app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Re-use the compiled Rust pieces from earlier builds (makes builds much faster).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tools
        run: npm ci

      - name: Run checks
        run: npm test

      - name: Build the .exe
        run: npm run build

      - name: Name the .exe
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/task-timer.exe dist/Task-Timer.exe
          ls -la dist

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: Task-Timer
          path: dist/Task-Timer.exe

      - name: Publish to the Releases page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Remove the old-style "latest" download and any earlier build of this same version.
          gh release delete latest --cleanup-tag --yes || true
          gh release delete "v$VERSION" --cleanup-tag --yes || true
          gh release create "v$VERSION" dist/Task-Timer.exe \
            --target "${{ github.sha }}" \
            --title "Task Timer $VERSION" \
            --latest \
            --notes "Download Task-Timer.exe below and double-click it to run. Already have Task Timer? Open Settings and press Check for updates."

  # Puts the iPhone/web version online with GitHub Pages (main branch only).
  iphone-web-app:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deploy
        uses: actions/deploy-pages@v4
